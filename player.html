<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <title>Chat Story Player</title>
  <style>
    :root { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #172238; background: #f3f5f9; font-synthesis: none; }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 300px; }
    button, input, select, textarea { font: inherit; }
    button, select { cursor: pointer; }
    button:disabled, select:disabled, input:disabled { cursor: default; opacity: .45; }
    button, a, select, input, textarea { -webkit-tap-highlight-color: transparent; }
    :focus-visible { outline: 3px solid #93b9ff; outline-offset: 3px; }
    button { border: 0; }
    svg { display: block; flex-shrink: 0; }
    [hidden] { display: none !important; }
    #controls-toggle { position: fixed; top: 16px; right: 16px; z-index: 5; display: grid; place-items: center; width: 36px; height: 36px; border: 1px solid #dfe4ec; border-radius: 10px; background: #fff; color: #718097; }
    #controls-toggle:hover { color: #2563eb; border-color: #b8c9e9; }
    a { color: #536077; text-decoration: none; font-size: 13px; }
    a:hover { color: #2563eb; }
    .button { min-height: 40px; padding: 10px 15px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 9px; font-size: 13px; font-weight: 650; background: #fff; color: #34445e; border: 1px solid #dce2ec; }
    .button:hover { background: #f5f8ff; border-color: #b8c9e9; }
    .primary { color: #fff; background: #2563eb; border-color: #2563eb; }
    .primary:hover { background: #1d4ed8; border-color: #1d4ed8; }
    main { min-height: 100dvh; padding: 24px 16px; display: flex; align-items: center; justify-content: center; }
    .stage { display: flex; justify-content: center; min-width: 0; width: 100%; }
    body.timeline-open main { gap: 28px; padding-top: 56px; }
    body.timeline-open .stage { width: var(--phone-width, 375px); flex: 0 1 var(--phone-width, 375px); }
    body.timeline-open #phone { height: min(760px, calc(100dvh - 80px)); }
    #phone { width: min(var(--phone-width, 375px), 100%); height: min(760px, calc(100dvh - 48px)); min-height: 360px; background: #fff; border: 1px solid #dfe4ec; border-radius: 22px; box-shadow: 0 14px 45px #23355313, 0 2px 4px #23355308; display: flex; flex-direction: column; overflow: hidden; position: relative; color: #111827; }
    #phone.framed { border: 11px solid #202b3b; border-radius: 40px; }
    .phone-status { min-height: 43px; flex-shrink: 0; display: flex; justify-content: space-between; align-items: flex-end; padding: 0 24px 7px; background: #f9fafb; font-size: 14px; font-weight: 650; }
    .phone-view { display: flex; flex-direction: column; flex: 1; min-height: 0; }
    .status-icons { display: flex; align-items: center; gap: 7px; }
    .battery { display: flex; align-items: center; gap: 4px; font-size: 12px; }
    .phone-header { height: 64px; flex-shrink: 0; position: relative; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; border-bottom: 1px solid #e8ebf0; background: #f9fafb; }
    .phone-header > svg, #chat-back svg { width: 28px; height: 28px; color: #267bfa; }
    #chat-back { position: relative; z-index: 1; display: grid; place-items: center; width: 36px; height: 40px; margin-left: -4px; padding: 0; background: transparent; }
    #back-unread { position: absolute; top: -1px; left: 21px; min-width: 16px; padding: 2px 4px; border-radius: 10px; color: white; background: #2563eb; font-size: 9px; line-height: 1.2; }
    .contact { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 2px; text-align: center; pointer-events: none; }
    .avatar { width: 28px; height: 28px; border-radius: 50%; overflow: hidden; background: #e1e6ed; color: #69768a; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 11px; font-weight: 650; }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }
    #contact-avatar { width: 32px; height: 32px; font-size: 13px; }
    #chat-name { font-size: 12px; line-height: 1.2; font-weight: 650; max-width: calc(100% - 96px); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .phone-header.no-avatar #chat-name { font-size: 14px; }
    .overview-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; height: 64px; flex-shrink: 0; padding: 0 19px; border-bottom: 1px solid #e8ebf0; background: #f9fafb; }
    .overview-header h2 { margin: 0; font-size: 27px; letter-spacing: -.8px; }
    #overview-current { display: grid; place-items: center; width: 36px; height: 40px; padding: 0; background: transparent; color: #267bfa; }
    #chat-list { flex: 1; min-height: 0; overflow-y: auto; padding: 0; margin: 0; list-style: none; }
    .chat-list-row { display: flex; align-items: center; gap: 12px; width: 100%; padding: 15px 17px; border-bottom: 1px solid #edf0f4; text-align: left; background: transparent; color: inherit; }
    .chat-list-row:hover, .chat-list-row:focus-visible { background: #f4f7fc; }
    .chat-list-row > .avatar { width: 44px; height: 44px; font-size: 17px; }
    .chat-list-copy { flex: 1; min-width: 0; }
    .chat-list-heading { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 4px; }
    .chat-list-name { min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-size: 15px; font-weight: 650; }
    .chat-list-owner { display: block; margin-top: 5px; color: #949dab; font-size: 10px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .chat-list-preview { color: #8892a2; font-size: 12px; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
    .unread-count { flex-shrink: 0; min-width: 19px; padding: 3px 5px; border-radius: 12px; background: #2563eb; color: white; font-size: 10px; line-height: 1.2; text-align: center; }
    .chat-list-row.unread .chat-list-preview { color: #53637c; }
    #chat-notification { position: absolute; top: 6px; left: 9px; right: 9px; z-index: 4; padding: 8px 12px; display: flex; align-items: center; gap: 10px; border: 1px solid #dce4ef; border-radius: 15px; background: #f8fafff5; color: #172238; text-align: left; box-shadow: 0 5px 24px #17223824; backdrop-filter: blur(12px); animation: arrive .18s ease-out; }
    #chat-notification > .avatar { width: 36px; height: 36px; }
    .notification-copy { flex: 1; min-width: 0; }
    .notification-heading { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 4px; }
    #notification-title { min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-size: 13px; font-weight: 650; }
    #notification-owner { max-width: 45%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; color: #8490a3; font-size: 10px; }
    #notification-preview { display: block; font-size: 12px; line-height: 1.4; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    #chat-scroll { flex: 1; min-height: 0; overflow-y: auto; padding: 12px 16px 18px; scrollbar-width: thin; scrollbar-color: #d5dce7 transparent; }
    .drag-scroll, .drag-scroll :is(.timeline-node, .timeline-segment, .chat-list-row) { cursor: grab; user-select: none; -webkit-user-select: none; }
    .drag-scroll img { -webkit-user-drag: none; }
    body.scroll-panning, body.scroll-panning * { cursor: grabbing !important; user-select: none !important; -webkit-user-select: none !important; }
    .message { display: flex; align-items: flex-end; gap: 7px; margin-top: 14px; }
    .message.sequence { margin-top: 4px; }
    .message.sent { justify-content: flex-end; }
    .message .avatar { width: 23px; height: 23px; margin-bottom: 2px; }
    .message .avatar.spacer { visibility: hidden; }
    .message-content { max-width: 82%; min-width: 0; }
    .sent .message-content { max-width: 76%; }
    .sender-name { font-size: 10px; color: #8b93a0; margin: 0 0 4px 3px; overflow-wrap: anywhere; }
    .bubble { font-size: 14px; line-height: 1.35; padding: 8px 13px; background: #ececef; border-radius: 17px 17px 17px 1px; color: #101318; white-space: pre-wrap; overflow-wrap: anywhere; }
    .sent .bubble { color: white; background: #087bff; border-radius: 17px 17px 1px 17px; }
    .green .sent .bubble { background: #30b95b; }
    .timestamp { margin: 29px 0 16px; text-align: center; color: #949ba7; font-size: 11px; white-space: pre-wrap; overflow-wrap: anywhere; }
    .new-messages-divider { display: flex; align-items: center; gap: 10px; padding: 12px 0; color: #6b7280; font-size: 11px; line-height: 16px; white-space: nowrap; }
    .new-messages-divider::before, .new-messages-divider::after { content: ''; height: 1px; flex: 1; background: #dfe3e8; }
    .new-messages-divider + .message, .new-messages-divider + .timestamp { margin-top: 0; }
    .chat-image { display: block; max-width: 100%; max-height: 220px; border-radius: 14px; border: 1px solid #e4e7ec; }
    .chat-image.crop { width: 240px; height: 175px; object-fit: cover; }
    .image-placeholder { min-height: 125px; width: 225px; max-width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 9px; padding: 18px; color: #788499; background: #f0f2f6; border: 1px solid #e1e6ee; border-radius: 14px; font-size: 12px; text-align: center; font-style: italic; white-space: pre-wrap; overflow-wrap: anywhere; }
    .typing { font-size: 11px; color: #8c95a3; margin: 16px 0 0 3px; display: flex; align-items: center; gap: 7px; min-height: 20px; }
    .typing-dots { display: flex; gap: 3px; }
    .typing-dots i { width: 5px; height: 5px; border-radius: 50%; background: #a8b1bd; animation: typing 1s infinite alternate; }
    .typing-dots i:nth-child(2) { animation-delay: .2s; }.typing-dots i:nth-child(3) { animation-delay: .4s; }
    @keyframes typing { from { opacity: .35; transform: translateY(0); } to { opacity: 1; transform: translateY(-3px); } }
    .message.new { animation: arrive .18s ease-out; }
    @keyframes arrive { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    .composer { flex-shrink: 0; border-top: 1px solid #e8ebf0; padding: 10px 12px 9px; display: flex; align-items: flex-end; gap: 8px; }
    .phone-session { flex-shrink: 0; padding: 5px 14px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    #phone-role { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #8b95a5; font-size: 11px; }
    #phone-play-button { flex-shrink: 0; min-height: 30px; padding: 5px 12px; white-space: nowrap; font-size: 12px; }
    #scripted-message { flex: 1; min-width: 0; min-height: 36px; max-height: 105px; padding: 8px 12px; border: 1px solid #dfe3e9; border-radius: 17px; background: #f5f6f8; color: #263349; resize: none; font-size: 12px; line-height: 1.45; }
    #scripted-message::placeholder { color: #969eab; }
    #send-button { width: 34px; height: 34px; border-radius: 50%; background: #2563eb; color: white; display: flex; align-items: center; justify-content: center; margin-bottom: 1px; }
    #send-button:hover:enabled { background: #1d4ed8; }
    .home-indicator { display: flex; justify-content: center; height: 19px; flex-shrink: 0; align-items: center; }
    .home-indicator::after { content: ''; width: 105px; height: 4px; background: #111827; border-radius: 4px; }
    .phone-empty { text-align: center; color: #8b96a7; padding: 55px 14px; font-size: 14px; line-height: 1.5; overflow-wrap: anywhere; }
    .phone-open-actions { display: flex; flex-direction: column; align-items: center; gap: 14px; }
    .text-button { padding: 0; color: #2563eb; background: none; font-size: 12px; }
    .dark { background: #050505 !important; color: #f3f4f6 !important; }
    .dark :is(.phone-status,.phone-header,.overview-header,.composer,.phone-session) { background: #050505; border-color: #25272c; }
    .dark .chat-list-row { border-color: #25272c; }
    .dark .chat-list-row:hover, .dark .chat-list-row:focus-visible { background: #191c22; }
    .dark .chat-list-row.unread .chat-list-preview { color: #bcc6d5; }
    .dark #chat-notification { background: #242a35f5; border-color: #3b4555; color: #f3f4f6; }
    .dark .bubble { background: #27282d; color: #f3f4f6; }
    .dark .sent .bubble { background: #087bff; }.dark.green .sent .bubble { background: #30b95b; }
    .dark .image-placeholder { background: #1e2229; border-color: #30353e; color: #a1aabc; }
    .dark .new-messages-divider { color: #9ca3af; }
    .dark .new-messages-divider::before, .dark .new-messages-divider::after { background: #30343c; }
    .dark #scripted-message { background: #1d1e24; border-color: #30313a; color: #e7eaf0; }
    .dark .home-indicator::after { background: #fff; }
    #player-controls { position: fixed; inset: 16px 16px auto auto; width: 320px; max-width: calc(100vw - 32px); max-height: calc(100dvh - 32px); margin: 0; padding: 18px; border: 1px solid #dfe4ec; border-radius: 16px; background: white; color: #34445e; box-shadow: 0 12px 45px #17223824; }
    #player-controls::backdrop { background: #17223820; }
    .controls-heading { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 5px; }
    h1 { min-width: 0; font-size: 18px; line-height: 1.3; margin: 0; overflow-wrap: anywhere; }
    #controls-close { flex-shrink: 0; display: grid; place-items: center; width: 28px; height: 28px; border-radius: 6px; background: #f3f5f9; color: #718097; }
    .description { font-size: 12px; color: #718097; margin: 0 0 18px; }
    #open-button { width: 100%; margin-bottom: 16px; }
    .card + .card { margin-top: 16px; padding-top: 16px; border-top: 1px solid #e8ebf0; }
    .playback-top { display: flex; align-items: center; justify-content: space-between; gap: 9px; margin-bottom: 12px; }
    .role { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; font-weight: 650; line-height: 1.5; color: #56647b; }
    .speed { border: 1px solid #dce2eb; border-radius: 7px; padding: 6px; background: white; color: #5e6b80; font-size: 11px; }
    .pause-control { display: flex; align-items: center; gap: 7px; font-size: 12px; cursor: pointer; }
    .secondary-controls { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 14px; }
    #restart-button { border: 0; background: none; color: #7b879b; font-size: 12px; padding: 3px 0; }
    .progress-label { font-size: 11px; color: #8a95a6; }
    .progress-track { margin-top: 17px; width: 100%; height: 4px; background: #edf0f5; border-radius: 4px; overflow: hidden; }
    #progress-fill { height: 100%; width: 0; background: #90b2f9; transition: width .2s; }
    #playback-status { margin: 10px 0 0; color: #73829a; font-size: 12px; line-height: 1.5; overflow-wrap: anywhere; }
    .navigation-controls { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 16px; }
    #timeline-panel { display: flex; flex-direction: column; flex: 0 0 360px; width: 360px; min-width: 0; height: min(760px, calc(100dvh - 80px)); border: 1px solid #dfe4ec; border-radius: 16px; background: #fff; color: #34445e; overflow: hidden; box-shadow: 0 5px 24px #17223808; }
    .timeline-heading { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px 0; }
    .timeline-heading h2 { margin: 0; font-size: 15px; font-weight: 650; }
    #timeline-close { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 7px; background: #f3f5f9; color: #718097; }
    .timeline-toolbar { display: flex; align-items: center; gap: 5px; padding: 8px 16px 12px; }
    .timeline-toolbar > button:not(.text-button) { min-width: 30px; height: 30px; padding: 0 7px; border-radius: 6px; background: #f3f5f9; color: #65758e; font-size: 14px; }
    #timeline-zoom-reset { font-size: 11px; min-width: 48px; }
    #timeline-now { margin-left: auto; }
    #timeline-viewport { flex: 1; min-height: 0; overflow: auto; border-top: 1px solid #e8edf4; background: #f8fafd; scrollbar-width: thin; scrollbar-gutter: stable; overflow-anchor: none; overscroll-behavior: contain; }
    #timeline-canvas { position: relative; overflow: hidden; }
    #timeline-scene { position: absolute; top: 0; transform-origin: 0 0; }
    #timeline-links { position: absolute; pointer-events: none; }
    .timeline-node { position: absolute; display: flex; flex-direction: column; justify-content: center; gap: 4px; padding: 8px 11px; border: 1px solid #dce3ee; border-left: 3px solid var(--moment-color); border-radius: 8px; background: #fff; color: #52627b; text-align: left; opacity: .7; }
    .timeline-node:hover, .timeline-node:focus-visible { opacity: 1; border-color: var(--moment-color); }
    .timeline-node[data-kind="chat"] { background: var(--moment-tint); border-color: var(--moment-color); }
    .timeline-node:is([data-kind="start"], [data-kind="end"], [data-kind="timestamp"]) { align-items: center; border-left-width: 1px; border-radius: 20px; text-align: center; }
    .timeline-node.played { opacity: 1; }
    .timeline-node.current { opacity: 1; outline: 2px solid #83abf7; outline-offset: 3px; }
    .timeline-node.selected:not(.current) { box-shadow: 0 0 0 2px #2563eb18; }
    .timeline-node strong, .timeline-node span { display: block; width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .timeline-node strong { font-size: calc(11px * var(--text-scale, 1)); font-weight: 650; }
    .timeline-node span { color: #8994a6; font-size: calc(10px * var(--text-scale, 1)); }
    .timeline-node[data-detail="dot"] { align-items: center; padding: 0; border: 0; background: transparent; border-radius: 12px; }
    .timeline-node[data-detail="dot"]::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--moment-color); border: 1px solid #fff; }
    .timeline-node[data-detail="dot"]:is(:hover, :focus-visible)::before { transform: scale(1.3); }
    .timeline-node[data-detail="dot"].current { outline: none; }
    .timeline-node[data-detail="dot"].current::before { box-shadow: 0 0 0 3px #f8fafd, 0 0 0 5px #83abf7; }
    .timeline-node[data-detail="label"] { padding: 5px 10px; gap: 0; }
    .timeline-node[data-detail="segment"] { padding: 6px 10px; gap: 2px; border-left-width: 3px; background: var(--moment-tint); }
    .timeline-node.active-segment { border-color: #83abf7; }
    .timeline-segment { position: absolute; width: 28px; padding: 0; border-radius: 14px; background: transparent; }
    .timeline-segment:hover { background: #3973d60c; }
    .controls-footer { margin-top: 18px; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    #error { margin-top: 14px; background: #fff3f3; color: #a33e45; border: 1px solid #f0d1d3; border-radius: 9px; padding: 11px 12px; font-size: 12px; line-height: 1.5; overflow-wrap: anywhere; }
    #drop-overlay { position: fixed; inset: 12px; z-index: 30; display: flex; align-items: center; justify-content: center; background: #f3f7fff2; border: 2px dashed #80a7f1; border-radius: 18px; color: #2563eb; font-size: 20px; font-weight: 650; pointer-events: none; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    @media(max-width:650px) {
      main { padding: 56px 10px max(12px, env(safe-area-inset-bottom)); }
      #controls-toggle { top: 10px; right: 12px; }
      #phone { height: min(760px, calc(100dvh - 68px - env(safe-area-inset-bottom))); }
    }
    @media(max-width:820px) {
      body.timeline-open main { flex-direction: column; gap: 16px; padding: 56px 12px 24px; }
      body.timeline-open .stage { width: 100%; flex: none; }
      body.timeline-open #phone { height: min(600px, calc(100dvh - 100px)); }
      #timeline-panel { flex: none; width: 100%; max-width: 600px; height: min(600px, calc(100dvh - 100px)); min-height: 300px; }
      #timeline-panel, #phone { scroll-margin-top: 56px; }
    }
    @media(prefers-reduced-motion:reduce) { *,*::before,*::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; } }
  </style>
</head>

  <button id="controls-toggle" aria-label="Open controls" title="Controls" aria-haspopup="dialog" aria-expanded="false" aria-controls="player-controls"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M4 7h7m4 0h5M4 17h3m4 0h9"/><circle cx="13" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg></button>
  <input type="file" id="story-file" accept=".json,application/json" hidden>
  <main>
    <section class="stage" aria-label="Chat playback">
      <div id="phone">

  <script>
    'use strict';
    const $ = id => document.getElementById(id);

    const DEFAULT_SETTINGS = { time: '09:41', battery: 100, signalStrength: 4, wifiStrength: 3, theme: 'blue', darkMode: false, screenWidth: 375, showAvatar: true, showFrame: false, cropImages: false, avatar: null };
    const isObject = value => value !== null && typeof value === 'object' && !Array.isArray(value);

    function validateSettings(raw) {

    function validateStory(data) {

      if (data.version !== 1) throw new Error(`Story version ${String(data.version)} is not supported. Export it again with the current generator.`);
      if (!isObject(data.story)) throw new Error('The story needs an ID and title.');

      if (!Array.isArray(data.characters) || !Array.isArray(data.chats) || !Array.isArray(data.nodes)) throw new Error('The story needs character, chat, and node lists.');
      const characters = new Map(), chats = new Map(), nodes = new Map(), messageIds = new Map();

        if (item.avatar != null) { avatar = safeImage(item.avatar); if (!avatar) throw new Error(`Invalid avatar for ${name}.`); }

        if (!isObject(item)) throw new Error('Invalid chat.');

          if (message.type === 'image' && !safeImage(content)) throw new Error('An image has an unsupported source. Use an image upload or an http(s) URL.');

      }
      const startNodeId = requireString(data.startNodeId,'Start node ID');
      if (!nodes.has(startNodeId)) throw new Error('The story’s starting step is missing.');
      for (const node of nodes.values()) if (node.next != null && !nodes.has(node.next)) throw new Error('A next step points to a missing node.');
      // Every v1 node has at most one outgoing edge. Validate iteratively so large stories do not overflow the call stack.
      const complete = new Set();
      for (const start of nodes.keys()) {
        const chain = new Set(); let id = start;
        while (id !== null && !complete.has(id)) {
          if (chain.has(id)) throw new Error('This story contains a loop. Automatic cycles are not supported.');
          chain.add(id); const node = nodes.get(id); id = node.type==='end'?null:node.next;
        }
        chain.forEach(id=>complete.add(id));
      }
      const path = traceStoryRoute({nodes,startNodeId});
      const messageCount = path.filter(node=>node.type==='message').length;
      if (!messageCount) throw new Error('This story has no playable messages.');
      return Object.freeze({story:Object.freeze(story),characters,chats,nodes,startNodeId,messageCount,partCount:path.filter(node=>node.type==='chat').length});
    }

    // Route resolution is shared by playback, seeking, and the timeline. Future choices
    // can select an outgoing link here without using a message's array position as its identity.
    function nextStoryNodeId(node) { return node.type==='end'?null:node.next; }
    function traceStoryRoute(story) {
      const route=[], seen=new Set(); let id=story.startNodeId;
      while(id!==null) {
        const node=story.nodes.get(id);
        if(!node || seen.has(id))throw new Error('The story path is invalid.');
        seen.add(id);route.push(node);id=nextStoryNodeId(node);
      }
      return Object.freeze(route);
    }

    class PlaybackEngine {
      constructor(story) { this.story=story; this.route=traceStoryRoute(story);this.routeIndex=new Map(this.route.map((node,index)=>[node.id,index]));this.reset(); }
      reset() { this.nodeId=this.story.startNodeId; this.visitedNodeIds=[]; this.histories=new Map(); this.returnMarkers=new Map(); this.chatStatuses=new Map(); this.lastMessageChatId=null; this.visitedChatIds=[]; this.activeChatId=null; this.started=false; this.finished=false; this.messageCount=0; this.part=0; }
      current() { return this.nodeId===null?null:this.story.nodes.get(this.nodeId); }
      chat() { return this.activeChatId===null?null:this.story.chats.get(this.activeChatId); }
      isOwnerTurn() { const node=this.current(); return node?.type==='message' && node.message.type!=='timestamp' && node.message.sender===this.story.chats.get(node.chatId).ownerId; }
      advance() {
        const node=this.current(); if (!node || this.finished) return null;

          this.activeChatId=node.chatId;

            if(history.length && this.lastMessageChatId!==node.chatId) {
              if(!this.returnMarkers.has(node.chatId))this.returnMarkers.set(node.chatId,new Set());
              this.returnMarkers.get(node.chatId).add(node.message.id);
            }
            history.push(node.message);this.lastMessageChatId=node.chatId;this.messageCount++;

        this.finished=this.nodeId===null;

      }
      seekTo(nodeId) {
        if(nodeId!==null&&!this.routeIndex.has(nodeId))throw new Error('That moment is not on the current story path.');
        const target=nodeId===null?-1:this.routeIndex.get(nodeId);
        this.reset();this.started=true;
        // Replay session state through the selected moment. This also gives future
        // choices/variables one consistent place to restore their earlier state.
        for(let index=0;index<=target;index++)this.advance();
      }
    }

    let story=null, engine=null, playing=false, timer=null, timerGeneration=0, readGeneration=0, resumeOnVisible=false;
    let viewedChatId=null, followActive=true, typingSender=null, ownerWaiting=false, sendLocked=false, newestMessageId=null;
    let renderedChatId=null, renderedMessageCount=0, headerAvatarKey='';
    let overviewOpen=false, pendingChatId=null, chatListKey='';
    const unreadCounts=new Map(), chatActivity=new Map();
    const historyScrolls=new Map();
    const TIMELINE_STEP=84, TIMELINE_MARGIN=24, TIMELINE_LANE=270, TIMELINE_MIN_ZOOM=.02, TIMELINE_MAX_ZOOM=2;
    let timelineModel=null, timelineView=null, timelineSelection=null, timelineFollow=true, timelineFrame=null, timelineViewportKey='', timelineZoom=1, timelineOffset=0, timelineTop=0;
    let scrollPan=null, suppressPanClick=false;
    const nameFor = id => story?.characters.get(id)?.name || 'Unknown';
    const headerLabel = chat => chat.title || chat.participantIds.filter(id=>id!==chat.ownerId).map(nameFor).join(', ');
    function element(tag,className,text) { const node=document.createElement(tag); if(className)node.className=className; if(text!==undefined)node.textContent=text; return node; }

    }
    function setupDragScrolling() {

    function openControls() {

    // Layout uses graph links, independently of playback order. Forks get separate
    // lanes and merges sit below their parents; v1 stories still supply one path.
    function layoutTimelineGraph(items,connections) {

      if(!ids.length&&viewedChatId)ids.push(viewedChatId);
      ids.sort((a,b)=>(chatActivity.get(b)||0)-(chatActivity.get(a)||0));
      const key=JSON.stringify(ids.map(id=>[id,engine.histories.get(id)?.length||0,unreadCounts.get(id)||0,id===engine.activeChatId&&ownerWaiting]));
      if(key===chatListKey)return;
      chatListKey=key;
      const list=$('chat-list'), top=list.scrollTop, focusedId=document.activeElement?.closest('[data-open-chat]')?.dataset.openChat;
      list.replaceChildren(...ids.map(id=>{
        const chat=story.chats.get(id), unread=unreadCounts.get(id)||0, history=engine.histories.get(id)||[];
        const last=history.findLast(message=>message.type!=='timestamp');
        const item=element('li'), row=element('button',`chat-list-row${unread?' unread':''}`);
        row.dataset.openChat=id;
        const copy=element('span','chat-list-copy'), heading=element('span','chat-list-heading');
        heading.appendChild(element('span','chat-list-name',headerLabel(chat)));
        if(unread)heading.appendChild(element('span','unread-count',unread>99?'99+':String(unread)));
        copy.append(heading,element('span','chat-list-preview',!last&&id===engine.activeChatId&&ownerWaiting?'Your turn':messagePreview(last,chat)),element('span','chat-list-owner',`As ${nameFor(chat.ownerId)}`));
        row.append(createAvatar(chatAvatar(chat),headerLabel(chat)),copy);
        row.setAttribute('aria-label',`${headerLabel(chat)}, as ${nameFor(chat.ownerId)}${unread?`, ${unread} unread`:''}`);
        row.addEventListener('click',()=>openChat(id));item.appendChild(row);return item;
      }));
      list.scrollTop=top;
      if(focusedId&&overviewOpen)Array.from(list.querySelectorAll('button')).find(row=>row.dataset.openChat===focusedId)?.focus({preventScroll:true});
    }
    function receiveMessage(node) {
      const chat=story.chats.get(node.chatId), incoming=node.message.type!=='timestamp'&&node.message.sender!==chat.ownerId;
      chatActivity.set(chat.id,engine.visitedNodeIds.length);
      if(!incoming||isChatVisible(chat.id))return;
      unreadCounts.set(chat.id,(unreadCounts.get(chat.id)||0)+1);
      pendingChatId=chat.id;
      const avatar=createAvatar(chatAvatar(chat),headerLabel(chat));avatar.id='notification-avatar';$('notification-avatar').replaceWith(avatar);
      $('notification-title').textContent=headerLabel(chat);
      $('notification-owner').textContent=`As ${nameFor(chat.ownerId)}`;
      $('notification-preview').textContent=messagePreview(node.message,chat);
      $('chat-notification').setAttribute('aria-label',`Open ${headerLabel(chat)}, as ${nameFor(chat.ownerId)}: ${messagePreview(node.message,chat)}`);
      $('notification-announcement').textContent=`New message from ${nameFor(node.message.sender)} in ${headerLabel(chat)}. Open the chat to continue.`;
    }
    // Leading timestamps do not decide whether a new block should open automatically.
    function firstChatMessage(node,chatId) {
      while(node&&node.type!=='end'&&node.chatId===chatId){
        if(node.type==='message'&&node.message.type!=='timestamp')return node.message;
        node=node.next===null?null:story.nodes.get(node.next);
      }
      return null;
    }
    function activatePlaybackChat(chatId) {
      engine.activeChatId=chatId;
      if(!engine.histories.has(chatId)){engine.histories.set(chatId,[]);engine.visitedChatIds.push(chatId);}
      const first=firstChatMessage(engine.current(),chatId), owner=story.chats.get(chatId).ownerId;
      if(!viewedChatId || (followActive&&!overviewOpen&&first?.sender===owner))viewedChatId=chatId;
    }
    function render() {
      if (!engine) return;
      const chat=previewChat(), active=engine.chat(), ownerTurn=ownerWaiting && playing && !sendLocked && !pendingChatId;
      const complete=engine.finished&&!pendingChatId, needsOpen=playing&&(!!pendingChatId||(ownerTurn&&!isChatVisible(active.id)));
      $('story-title').textContent=story.story.title;
      $('story-description').textContent=`${story.chats.size} ${story.chats.size===1?'chat':'chats'} · ${story.messageCount} messages`;
      $('playback-paused').disabled=complete;
      $('playback-paused').checked=!playing&&!complete;
      $('restart-button').disabled=!engine.started;
      $('playing-as').textContent=active?`As ${nameFor(active.ownerId)}`:'Ready';
      $('progress-label').textContent=`${engine.messageCount} / ${story.messageCount} messages`;
      const progress=Math.round(engine.messageCount/story.messageCount*100); $('progress-fill').style.width=`${progress}%`; $('progress').setAttribute('aria-valuenow',progress);
      const status=!engine.started?'Ready.':complete?'Complete.':!playing?'Paused.':pendingChatId?'Open the new message.':ownerTurn?'Your turn.':typingSender?`${typingSender} is typing…`:'Playing…';
      $('playback-status').textContent=status;
      $('phone-session').hidden=false;
      $('phone-play-button').hidden=!complete&&!needsOpen;
      $('phone-play-button').textContent=needsOpen?'Open chat':'Replay';
      $('conversation-view').hidden=overviewOpen;$('chat-overview').hidden=!overviewOpen;$('chat-composer').hidden=overviewOpen;
      $('chat-back').disabled=false;$('show-chats-button').disabled=false;
      $('timeline-button').disabled=false;
      const totalUnread=Array.from(unreadCounts.values()).reduce((total,count)=>total+count,0);
      $('back-unread').hidden=!totalUnread;$('back-unread').textContent=totalUnread>99?'99+':String(totalUnread);
      $('chat-back').setAttribute('aria-label',totalUnread?`Chats, ${totalUnread} unread`:'Chats');
      $('chat-notification').hidden=!pendingChatId||overviewOpen;
      renderChatOverview();
      renderTimeline();
      const browsing=overviewOpen || (!!active && chat?.id!==active.id);
      $('send-button').disabled=!ownerTurn;
      $('send-button').title=browsing?'Return to the current chat':'Send next message (Enter)';
      $('send-button').setAttribute('aria-label',browsing?'Return to the current chat':'Send next message');
      const draft=ownerTurn && !browsing?engine.current().message:null;
      $('scripted-message').value=draft?(draft.type==='text'?draft.content:draft.type==='image-placeholder'?`[Image: ${draft.content}]`:'[Image]'):'';
      $('scripted-message').placeholder=browsing?'Viewing history':pendingChatId?'New message':complete?'Complete':!engine.started?'Message':!playing?'Paused':typingSender?'Waiting…':'Message';
      $('scripted-message').rows=draft?Math.min(4,Math.max(1,draft.content.split('\n').length,Math.ceil(draft.content.length/45))):1;
      if(!chat)return;
      document.documentElement.style.setProperty('--phone-width',`${chat.settings.screenWidth}px`);
      $('phone').classList.toggle('dark',chat.settings.darkMode);$('phone').classList.toggle('green',chat.settings.theme==='green');$('phone').classList.toggle('framed',chat.settings.showFrame);
      document.querySelector('.phone-header').classList.toggle('no-avatar',!chat.settings.showAvatar);
      const phoneOwner=overviewOpen?(active?.ownerId||chat.ownerId):chat.ownerId;
      $('phone-role').textContent=`As ${nameFor(phoneOwner)}`;
      $('phone-role').title=`Playing as ${nameFor(phoneOwner)}`;
      const phoneStatus={...chat.settings,...engine.chatStatuses.get(chat.id)};
      $('clock').textContent=phoneStatus.time.replace(/^0/,''); $('battery-text').textContent=`${phoneStatus.battery}%`;
      $('battery-fill').setAttribute('width',phoneStatus.battery/100*16);$('battery-fill').setAttribute('fill',phoneStatus.battery<20?'#ef4444':'currentColor');
      document.querySelectorAll('[data-bar]').forEach(node=>node.style.opacity=Number(node.dataset.bar)<=phoneStatus.signalStrength?'1':'.2');
      document.querySelectorAll('[data-level]').forEach(node=>node.style.opacity=Number(node.dataset.level)<=phoneStatus.wifiStrength?'1':'.2');$('wifi-off').toggleAttribute('hidden',phoneStatus.wifiStrength!==0);
      $('chat-name').textContent=headerLabel(chat);
      const source=chatAvatar(chat);
      const avatarKey=JSON.stringify([chat.id,source,headerLabel(chat),chat.settings.showAvatar]);
      if(headerAvatarKey!==avatarKey){const avatar=createAvatar(source,headerLabel(chat));avatar.id='contact-avatar';avatar.hidden=!chat.settings.showAvatar;$('contact-avatar').replaceWith(avatar);headerAvatarKey=avatarKey;}
      if(overviewOpen)return;
      const messages=engine.histories.get(chat.id)||[];
      const scroll=$('chat-scroll'), changedChat=renderedChatId!==chat.id;
      const atBottom=scroll.scrollHeight-scroll.clientHeight-scroll.scrollTop<50;
      if(changedChat){stopScrollPan(scroll);if(renderedChatId)historyScrolls.set(renderedChatId,scroll.scrollTop);$('chat-messages').replaceChildren();renderedMessageCount=0;renderedChatId=chat.id;}
      if(messages.length<renderedMessageCount){$('chat-messages').replaceChildren();renderedMessageCount=0;}
      const returnMarkers=engine.returnMarkers.get(chat.id);
      for(let index=renderedMessageCount;index<messages.length;index++) {
        const beginsReturn=returnMarkers?.has(messages[index].id);
        if(beginsReturn) {
          const divider=element('div','new-messages-divider','New messages');
          divider.setAttribute('role','separator');divider.setAttribute('aria-label','New messages');
          $('chat-messages').appendChild(divider);
        }
        $('chat-messages').appendChild(renderMessage(messages[index],chat,beginsReturn?null:messages[index-1]));
      }
      renderedMessageCount=messages.length;
      $('phone-empty').hidden=engine.started || messages.length>0;
      $('phone-open-actions').hidden=true;
      $('phone-empty-text').hidden=false;
      $('phone-empty-text').textContent=story.story.title;
      $('typing').hidden=!(playing && typingSender && !browsing && !pendingChatId);$('typing-label').textContent=typingSender?`${typingSender} is typing…`:'';
      if(changedChat)scroll.scrollTop=historyScrolls.get(chat.id)??scroll.scrollHeight;
      else if(atBottom&&!browsing&&scrollPan?.viewport!==scroll)scroll.scrollTop=scroll.scrollHeight;
      newestMessageId=null;
    }
    function clearTimer() { clearTimeout(timer);timer=null;timerGeneration++;typingSender=null;ownerWaiting=false;sendLocked=false; }
    function schedule(delay,callback) { const generation=timerGeneration;timer=setTimeout(()=>{timer=null;if(generation!==timerGeneration || !playing)return;callback();},delay); }
    function pause() { clearTimer();playing=false;render(); }
    function pump() {
      if(!engine || !playing || engine.finished || pendingChatId){render();return;}
      const node=engine.current();
      if(!node){engine.finished=true;playing=false;render();return;}
      const speed=Number($('speed').value);
      if(node.type==='message')activatePlaybackChat(node.chatId);
      if(node.type==='message' && engine.isOwnerTurn()) {
        ownerWaiting=true;typingSender=null;render();return;
      }
      ownerWaiting=false;
      if(node.type==='message' && node.message.type!=='timestamp')typingSender=nameFor(node.message.sender);
      render();
      const delay=node.type==='chat'?(engine.visitedNodeIds.length?900:220):node.type==='end'?650:node.message.type==='timestamp'?550:Math.min(2300,850+node.message.content.length*16);
      schedule(delay/speed,()=>{
        const visited=engine.advance();typingSender=null;
        if(visited?.type==='chat')activatePlaybackChat(visited.chatId);
        if(visited?.type==='message'){newestMessageId=visited.message.id;receiveMessage(visited);}
        if(engine.finished&&!pendingChatId)playing=false;
        render();pump();
      });
    }
    function play({closePanel=true}={}) {
      if(!engine)return;
      if(engine.finished&&!pendingChatId){restart();return;}
      if(closePanel)closeControls();
      clearTimer();engine.started=true;resumeOnVisible=document.hidden;playing=!document.hidden;
      if(playing)pump();else render();
    }
    function restart() {
      if(!engine)return false;
      const wasPlaying=playing;pause();
      if(engine.started && !confirm('Restart this story from the beginning?')){if(wasPlaying)play({closePanel:false});return false;}
      timelineFollow=true;
      engine.reset();viewedChatId=null;followActive=true;newestMessageId=null;renderedChatId=null;renderedMessageCount=0;historyScrolls.clear();resetNavigation();viewedChatId=previewChat()?.id||null;play();return true;
    }
    function sendMessage() {
      if(!engine || !playing || pendingChatId || !ownerWaiting || sendLocked || !engine.isOwnerTurn())return;
      if(!isChatVisible(engine.activeChatId)){openChat(engine.activeChatId);return;}
      followActive=true;viewedChatId=engine.current().chatId;ownerWaiting=false;sendLocked=true;
      const visited=engine.advance();newestMessageId=visited.message.id;chatActivity.set(visited.chatId,engine.visitedNodeIds.length);render();
      if(engine.finished){playing=false;sendLocked=false;render();return;}
      schedule(Math.max(350,500/Number($('speed').value)),()=>{sendLocked=false;pump();});
    }
    function loadStory(raw) {
      const next=validateStory(raw);timelineModel=null;timelineViewportKey='';timelineFollow=true;clearTimer();playing=false;resumeOnVisible=false;story=next;engine=new PlaybackEngine(story);viewedChatId=null;followActive=true;newestMessageId=null;renderedChatId=null;renderedMessageCount=0;headerAvatarKey='';historyScrolls.clear();resetNavigation();viewedChatId=previewChat()?.id||null;
      $('error').hidden=true;document.title=`${story.story.title} — Chat Story Player`;play();
    }
    function showError(error) { $('error').textContent=error.message || 'Could not open story.';$('error').hidden=false;openControls(); }
    async function openFile(file) {
      if(!file)return;const generation=++readGeneration;
      try { if(file.size>MAX_FILE_SIZE)throw new Error('Choose a story smaller than 50 MiB.');const text=await file.text();if(generation!==readGeneration)return;let raw;try{raw=JSON.parse(text);}catch(_){throw new Error('This file is not valid JSON.');}loadStory(raw); }
      catch(error){if(generation===readGeneration)showError(error);}
    }
    function exampleStory() {
      const data={format:'chat-story-player',version:1,story:{id:'movie-night',title:'The movie-night plan'},characters:['User','Sarah','Max'].map(name=>({id:name.toLowerCase(),name,avatar:null})),chats:[
        {id:'sarah',title:'',participantIds:['user','sarah'],ownerId:'user',settings:{}},
        {id:'max',title:'',participantIds:['user','max'],ownerId:'user',settings:{}},
        {id:'friends',title:'',participantIds:['sarah','max'],ownerId:'sarah',settings:{theme:'green'}},
        {id:'group',title:'Movie night',participantIds:['user','sarah','max'],ownerId:'user',settings:{darkMode:true,battery:62}}
      ],startNodeId:'step-0',nodes:[]};
      const records=[['chat','sarah'],['message','sarah','timestamp',null,'Friday, 4:30 PM'],['message','sarah','text','sarah','Still up for a movie tonight?'],['message','sarah','text','user',"Definitely! Let me check with Max."],['chat','max'],['message','max','text','user','Movie night with Sarah?'],['message','max','text','max',"Count me in. I'll bring snacks."],['chat','friends'],['message','friends','text','max',"Does User know we're getting popcorn first?"],['message','friends','text','sarah',"Not yet. Let's put it in the group."],['chat','group'],['message','group','text','max','Snacks before the movie?'],['message','group','text','sarah','Only if there is popcorn!'],['message','group','image-placeholder','user','A cinema with a café next door'],['message','group','text','user','Found the perfect place. See you at 6:30!'],['chat','sarah'],['message','sarah','text','sarah',"Tickets are booked. This is going to be fun."],['end']];
      data.nodes=records.map((record,index)=>{const node={id:`step-${index}`,type:record[0]};if(node.type==='end')return node;node.chatId=record[1];node.next=`step-${index+1}`;if(node.type==='message')node.message={id:`message-${index}`,type:record[2],sender:record[3],content:record[4],altText:''};return node;});
      return data;
    }
    setupDragScrolling();
    $('controls-toggle').addEventListener('click',openControls);
    $('controls-close').addEventListener('click',closeControls);
    $('player-controls').addEventListener('close',()=>$('controls-toggle').setAttribute('aria-expanded','false'));
    function dismissOnBackdrop(dialog,close) {
      let pressedOutside=false;
      const outside=event=>{const bounds=dialog.getBoundingClientRect();return event.clientX<bounds.left||event.clientX>bounds.right||event.clientY<bounds.top||event.clientY>bounds.bottom;};
      dialog.addEventListener('pointerdown',event=>{pressedOutside=event.button===0&&event.target===dialog&&outside(event);});
      dialog.addEventListener('click',event=>{if(pressedOutside&&event.target===dialog&&outside(event))close();pressedOutside=false;});
      dialog.addEventListener('pointercancel',()=>{pressedOutside=false;});dialog.addEventListener('close',()=>{pressedOutside=false;});
    }
    dismissOnBackdrop($('player-controls'),closeControls);
    $('timeline-button').addEventListener('click',openTimeline);$('timeline-close').addEventListener('click',closeTimeline);
    $('timeline-now').addEventListener('click',()=>{timelineFollow=true;renderTimeline({center:true});});
    $('timeline-zoom-out').addEventListener('click',()=>zoomTimeline(timelineZoom/1.25));
    $('timeline-zoom-in').addEventListener('click',()=>zoomTimeline(timelineZoom*1.25));
    $('timeline-zoom-reset').addEventListener('click',()=>zoomTimeline(1));
    $('timeline-viewport').addEventListener('pointerdown',()=>{timelineFollow=false;});
    $('timeline-viewport').addEventListener('wheel',event=>{
      timelineFollow=false;
      event.preventDefault();const viewport=event.currentTarget;
      if(event.shiftKey||(!event.ctrlKey&&!event.metaKey&&Math.abs(event.deltaX)>Math.abs(event.deltaY))){viewport.scrollLeft+=event.deltaX||event.deltaY;return;}
      const rect=viewport.getBoundingClientRect(),delta=event.deltaY*(event.deltaMode===1?16:event.deltaMode===2?viewport.clientHeight:1);
      zoomTimeline(timelineZoom*Math.exp(-Math.max(-500,Math.min(500,delta))*.002),{x:event.clientX-rect.left-viewport.clientLeft,y:event.clientY-rect.top-viewport.clientTop});
    },{passive:false});
    $('timeline-viewport').addEventListener('keydown',event=>{
      if(!timelineModel||event.altKey||event.ctrlKey||event.metaKey)return;
      const focused=event.target.closest('[data-timeline-index]'),index=focused?Number(focused.dataset.timelineIndex):timelineModel.byId.get(timelineSelection).index;
      let target;
      if(event.key==='ArrowDown')target=Math.min(timelineModel.moments.length-1,index+1);
      else if(event.key==='ArrowUp')target=Math.max(0,index-1);
      else if(event.key==='Home')target=0;
      else if(event.key==='End')target=timelineModel.moments.length-1;
      else if(event.key==='Enter'){event.preventDefault();if(!event.repeat){if(focused?.dataset.timelineSegment)zoomTimelineVisit(focused.dataset.timelineSegment);else seekStory(timelineModel.moments[index].id);}return;}
      else return;
      event.preventDefault();selectTimelineMoment(timelineModel.moments[target].id,{center:true});
      ($('timeline-points').querySelector(`[data-timeline-index="${target}"]`)||$('timeline-viewport')).focus({preventScroll:true});
    });
    $('timeline-viewport').addEventListener('scroll',()=>{if(timelineFrame===null)timelineFrame=requestAnimationFrame(()=>{timelineFrame=null;paintTimelineViewport();});});
    window.addEventListener('resize',()=>renderTimeline({center:true}));
    document.addEventListener('keydown',event=>{if(event.key==='Escape'&&!event.defaultPrevented&&!$('player-controls').open&&!$('timeline-panel').hidden){event.preventDefault();closeTimeline();}});
    for(const id of ['open-button','phone-open-button'])$(id).addEventListener('click',()=>$('story-file').click());
    $('story-file').addEventListener('change',event=>{openFile(event.target.files?.[0]);event.target.value='';});
    for(const id of ['example-button','phone-example-button'])$(id).addEventListener('click',()=>{readGeneration++;loadStory(exampleStory());});
    $('playback-paused').addEventListener('change',event=>{resumeOnVisible=false;if(event.target.checked)pause();else play({closePanel:false});});
    $('phone-play-button').addEventListener('click',event=>{if(event.detail>1)return;if(playing&&(pendingChatId||ownerWaiting))openChat(pendingChatId||engine.activeChatId);else play();});
    $('chat-back').addEventListener('click',showChatOverview);
    $('show-chats-button').addEventListener('click',showChatOverview);
    $('overview-current').addEventListener('click',()=>openChat(engine?.activeChatId||viewedChatId));
    $('chat-notification').addEventListener('click',()=>openChat(pendingChatId));
    $('restart-button').addEventListener('click',restart);
    $('send-button').addEventListener('click',event=>{if(event.detail<=1)sendMessage();});
    $('scripted-message').addEventListener('keydown',event=>{if(event.key==='Enter'&&!event.repeat){event.preventDefault();sendMessage();}});
    document.addEventListener('keydown',event=>{if(event.key==='Enter'&&!event.defaultPrevented&&!event.repeat&&!event.altKey&&!event.ctrlKey&&!event.metaKey&&!document.querySelector('dialog[open]')&&!event.target.closest('button,input,select,textarea,a,#timeline-panel')){event.preventDefault();sendMessage();}});
    $('speed').addEventListener('change',()=>{if(playing){clearTimer();pump();}});
    document.addEventListener('visibilitychange',()=>{
      if(document.hidden)stopScrollPan();
      if(document.hidden&&playing){resumeOnVisible=true;pause();}
      else if(!document.hidden&&resumeOnVisible){resumeOnVisible=false;play({closePanel:false});}
    });
    let dragDepth=0;
    document.addEventListener('dragenter',event=>{if(event.dataTransfer?.types.includes('Files')){event.preventDefault();dragDepth++;$('drop-overlay').hidden=false;}});
    document.addEventListener('dragover',event=>{if(event.dataTransfer?.types.includes('Files'))event.preventDefault();});
    document.addEventListener('dragleave',event=>{if(dragDepth){event.preventDefault();if(--dragDepth===0)$('drop-overlay').hidden=true;}});
    document.addEventListener('drop',event=>{event.preventDefault();dragDepth=0;$('drop-overlay').hidden=true;openFile(event.dataTransfer?.files?.[0]);});
    window.addEventListener('blur',()=>{$('drop-overlay').hidden=true;dragDepth=0;});
  </script>
